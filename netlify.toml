[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Set PUBLIC_SITE_URL in the Netlify UI (Site settings → Environment variables)
  # to your canonical origin, e.g. https://www.influentlat.com — required for sitemap + canonical SEO.

[context.production.environment]
  PUBLIC_SITE_URL = "https://www.influentlat.com"

# Server-side root redirect — must run before the static index.html stub.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true
